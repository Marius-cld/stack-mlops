# Un job par brique, comme si chacune avait son dépôt.
# API de serving : tests (dont contrat publié à jour) puis build de l'image. Le test d'intégration
# (registre MLflow réel) est ignoré : pas de serveur MLflow en CI.
# Frontend : types à jour avec le contrat de l'API, lint, build.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  api:
    name: API de serving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest src/deploying/tests

      - name: Image Docker
        run: docker build -f services/api/Dockerfile .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances
        run: npm ci

      # Échoue si le contrat publié par l'API a changé sans que les types aient été régénérés
      - name: Types à jour avec le contrat de l'API
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
